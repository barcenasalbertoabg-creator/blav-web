  <text x="700" y="316" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#16a34a" font-weight="600">Activo</text>

  <!-- Fila 6 — D6 · crema -->
  <rect x="18" y="341" width="764" height="49" fill="#f7f3ec"/>
  <text x="39" y="365" text-anchor="middle" dominant-baseline="middle"
