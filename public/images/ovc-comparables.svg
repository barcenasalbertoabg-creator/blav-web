  <!-- Línea decorativa bajo título -->
  <rect x="18" y="52" width="764" height="1" fill="#0d1b2e" opacity="0.12"/>

  <!-- ═══ CABECERA DE TABLA (navy) ═══ -->
  <!-- Columnas: # x=18 w=42 | Descripción x=60 w=250 | m² x=310 w=70 | Precio x=380 w=140 | $/m² x=520 w=118 | Estado x=638 w=124 -->
  <rect x="18" y="58" width="764" height="38" fill="#0d1b2e"/>

  <text x="39" y="77" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="11" fill="white" font-weight="600">#</text>
  <text x="68" y="77" text-anchor="start" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="11" fill="white" font-weight="600">Descripci&#243;n</text>
  <text x="345" y="77" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="11" fill="white" font-weight="600">m&#178;</text>
  <text x="450" y="77" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="11" fill="white" font-weight="600">Precio</text>
  <text x="579" y="77" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="11" fill="white" font-weight="600">$/m&#178;</text>
  <text x="700" y="77" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="11" fill="white" font-weight="600">Estado</text>

  <!-- ═══ FILAS (altura 49px) ═══ -->
  <!-- Fila 1 — D1★ · blanco -->
  <rect x="18" y="96" width="764" height="49" fill="white"/>
  <text x="39" y="120" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0d1b2e" font-weight="700">D1&#9733;</text>
  <text x="68" y="120" text-anchor="start" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0d1b2e">San Patricio PB Sendas</text>
  <text x="345" y="120" text-anchor="middle" dominant-baseline="middle"
