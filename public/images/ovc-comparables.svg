  <text x="450" y="365" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">$1,465,000</text>
  <text x="579" y="365" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">n/d</text>
  <text x="700" y="365" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#16a34a" font-weight="600">Activo</text>

  <!-- Borde inferior de tabla -->
  <rect x="18" y="390" width="764" height="1" fill="#0d1b2e" opacity="0.2"/>

  <!-- Nota al pie -->
  <text x="18" y="418" text-anchor="start" dominant-baseline="middle"
