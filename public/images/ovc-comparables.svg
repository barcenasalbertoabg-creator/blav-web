    &#9733; Comparable m&#225;s cercano al sujeto en tipo, ubicaci&#243;n y superficie.
  </text>
  <text x="18" y="436" text-anchor="start" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#9ca3af">
    Fuente: portales p&#250;blicos &#183; Datos al momento del an&#225;lisis &#183; BLAV Bienes Ra&#237;ces &#183; Mayo 2025
  </text>

</svg>
